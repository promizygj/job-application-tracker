# Render Blueprint for the JobTrack API (https://render.com/docs/blueprint-spec).
# Render → New → Blueprint → pick this repo. Values marked `sync: false` are asked for once,
# in the dashboard, and are never stored in this file. See docs/05-deployment.md.
services:
  - type: web
    name: jobtrack-api
    runtime: node
    plan: free
    # Keep the API close to the database: Frankfurt pairs with Neon's "AWS Europe Central 1 (Frankfurt)".
    region: frankfurt
    rootDir: server
    buildCommand: npm ci
    # Applies any pending database migrations, then starts the API.
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Vercel's rewrite proxy + Render's load balancer sit in front of the API.
      - key: TRUST_PROXY
        value: "2"
      # Render's free disk is wiped on every restart, so files go to Cloudinary.
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: CLOUDINARY_FOLDER
        value: jat
      # Secrets and per-account values: entered in the dashboard.
      - key: DATABASE_URL # Neon connection string (direct, not "-pooler"), ends with ?sslmode=require
        sync: false
      - key: CLIENT_URL # the Vercel URL, e.g. https://jobtrack-promizygj.vercel.app
        sync: false
      - key: AUTH_SECRET # must be identical to AUTH_SECRET on Vercel
        sync: false
      - key: INTERNAL_API_SECRET # must be identical to INTERNAL_API_SECRET on Vercel
        sync: false
      - key: CLOUDINARY_URL # cloudinary://<api_key>:<api_secret>@<cloud_name>
        sync: false
      # Email via Brevo's HTTP API. (Not SMTP: Render's free plan blocks outbound ports 25/465/587.)
      - key: BREVO_API_KEY # Brevo → SMTP & API → API Keys → Generate a new API key
        sync: false
      - key: MAIL_FROM # e.g. JobTrack <promizygj@gmail.com> (a sender verified in Brevo)
        sync: false
