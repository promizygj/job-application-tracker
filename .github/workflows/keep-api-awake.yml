# Keeps the free Render API from going to sleep.
#
# Render's free instances sleep after 15 minutes without traffic, and the first request after that
# takes ~45 seconds (users saw "Something went wrong" on sign-up). Hitting the health check every
# 10 minutes keeps it awake. One always-on free service uses ~744 of Render's 750 free hours/month.
#
# To ping a different URL (e.g. the Render one directly), set a repository variable named
# HEALTH_URL in GitHub → Settings → Secrets and variables → Actions → Variables.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *" # GitHub may run scheduled jobs a few minutes late at busy times
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions: {}

concurrency:
  group: keep-api-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health check
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://jatracker.vercel.app/api/v1/health' }}
        run: |
          # --max-time covers a cold start (~45s); retries cover a gateway error while it wakes.
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            "$HEALTH_URL"
          echo
